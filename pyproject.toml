[project]
name = "callsat-audit"
version = "0.1.0"
description = "Auditability and calibration stress tests for LLM-based satisfaction scoring on synthetic call logs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[project.optional-dependencies]
llm = [
    "mlx-lm>=0.28",
    "openai>=1.50",
]

[project.scripts]
callsat = "callsat_audit.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callsat_audit"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "NPY", "PT"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]
"tests/*" = ["S101", "PT011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ty]
# ty is run as a standalone tool: `uvx ty check src`
